name: OVH VPS check

on:
  schedule:
    # Off the :00/:05 marks, which GitHub's busy scheduler tends to drop; runs may still come every 10-20 min.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: # manual run; inputs allow a test against a datacenter that has stock
    inputs:
      dc:
        default: WAW
      plans:
        default: vps-2027-model2 vps-2027-model3
      ping:
        description: "@everyone even outside Warsaw (test)"
        type: boolean
        default: false

permissions:
  contents: write # to commit state.json

concurrency: ovh-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_ovh.py --state state.json --dc "$DC" --plans $PLANS $PING
        env:
          PING: ${{ inputs.ping && '--ping' || '' }}
          OVH_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DC: ${{ inputs.dc || 'WAW' }}
          PLANS: ${{ inputs.plans || 'vps-2027-model2 vps-2027-model3' }}
      - name: Save state
        run: |
          git add state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state"
          git push
